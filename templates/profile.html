{% extends "base.html" %}{% block title %}My Profile{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">PERSONALIZE YOUR JOURNEY</span><h1>My profile</h1><p>Choose a target role and add your skills for better recommendations.</p></div></div>
<form method="post" class="panel form-stack"><label>Education<input name="education" value="{{ user.education }}" placeholder="e.g. B.Tech CSE, 2nd year"></label><label>Target job role<select name="target_role">{% for role in roles %}<option {% if user.target_role==role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><div><label>Your skills</label><div class="skill-checks">{% for skill in all_skills %}<label class="check"><input type="checkbox" name="skills" value="{{ skill }}" {% if skill.lower() in (user.skills or '').lower() %}checked{% endif %}>{{ skill }}</label>{% endfor %}</div></div><label>Other skills (comma separated)<input name="extra_skills" placeholder="e.g. teamwork, public speaking"></label><button class="btn">Save profile</button></form>
{% endblock %}
