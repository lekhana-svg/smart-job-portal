{% extends "base.html" %}{% block title %}Post a Job{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">EMPLOYER WORKSPACE</span><h1>Publish a vacancy</h1><p>Set the role requirements and number of seats.</p></div></div><form method="post" class="panel form-stack"><label>Job title<input name="title" required placeholder="e.g. Junior Python Developer"></label><label>Job category<select name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Required skills (comma separated)<input name="skills" required placeholder="Python, SQL, Communication"></label><label>Number of seats<input type="number" name="seats" min="1" max="10000" value="1" required></label><label>Job description<textarea name="description" rows="5" placeholder="Responsibilities, eligibility, location, experience..."></textarea></label><button class="btn">Publish vacancy</button></form>{% endblock %}
